# Builds the downloadable installers:
#   • Windows — TaskySetup.exe (Inno Setup)
#   • macOS   — Tasky-<version>-arm64.dmg (Apple silicon) and Tasky-<version>-x64.dmg (Intel)
# The files are attached to each run under "Artifacts". Before packaging, each platform starts
# the app with sample tasks and notes and opens every page (scripts/smoke-test.*); a crash or a
# logged error fails the build, so a broken installer can't be released.
# Pushing a v* tag also publishes a GitHub Release with all three installers, using
# installer/RELEASE_NOTES.md as its description.
#
# Code signing switches on by itself once these repository secrets exist (see BUILD.md):
#   Windows: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#   macOS:   MACOS_CERTIFICATE (base64 .p12), MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_IDENTITY,
#            and for notarization APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
name: Build installers

on:
  push:
    branches: [main, cross-platform-macos]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2022
    env:
      # Secrets cannot be tested in a step condition directly.
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Tasky/Tasky.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained, win-x64)
        run: dotnet publish Tasky/Tasky.csproj -c Release -r win-x64 -o Tasky/bin/Release/net10.0/win-x64/publish

      - name: Smoke test (sample data, every page)
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Exe Tasky/bin/Release/net10.0/win-x64/publish/Tasky.exe

      - name: Prepare code signing
        id: signing
        if: env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'tasky-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Sign Tasky.exe
        if: steps.signing.outputs.pfx != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          & "${{ steps.signing.outputs.signtool }}" sign /f "${{ steps.signing.outputs.pfx }}" /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 Tasky/bin/Release/net10.0/win-x64/publish/Tasky.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer
        if: steps.signing.outputs.pfx != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          & "${{ steps.signing.outputs.signtool }}" sign /f "${{ steps.signing.outputs.pfx }}" /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 installer/Output/TaskySetup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Tasky-${{ steps.version.outputs.value }}-Windows-installer
          path: installer/Output/TaskySetup.exe
          if-no-files-found: error

  macos:
    name: macOS dmg (${{ matrix.arch }})
    runs-on: macos-14
    env:
      HAS_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Import the Developer ID certificate
        if: env.HAS_MACOS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/tasky-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build Tasky.app and dmg
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/package-macos.sh ${{ matrix.arch }}

      # The runner is Apple silicon, so the arm64 build can be launched directly.
      - name: Smoke test (sample data, every page, screenshot)
        if: matrix.arch == 'arm64'
        run: ./scripts/smoke-test.sh dist/Tasky.app/Contents/MacOS/Tasky "$RUNNER_TEMP/tasky-macos.png"

      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64' && always()
        with:
          name: macos-smoke-test-screenshot
          path: ${{ runner.temp }}/tasky-macos.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Tasky-macOS-${{ matrix.arch }}-dmg
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Name the downloads
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir release
          cp artifacts/*-Windows-installer/TaskySetup.exe       "release/Tasky-$VERSION-Windows-Setup.exe"
          cp artifacts/Tasky-macOS-arm64-dmg/Tasky-*-arm64.dmg   "release/Tasky-$VERSION-macOS-AppleSilicon.dmg"
          cp artifacts/Tasky-macOS-x64-dmg/Tasky-*-x64.dmg       "release/Tasky-$VERSION-macOS-Intel.dmg"
          ls -l release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Tasky ${GITHUB_REF_NAME#v}" \
            --notes-file installer/RELEASE_NOTES.md
