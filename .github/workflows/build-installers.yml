# Builds the downloadable installers:
#   • Windows — TaskySetup.exe (Inno Setup)
#   • macOS   — Tasky-<version>-arm64.dmg (Apple silicon) and Tasky-<version>-x64.dmg (Intel)
# The files are attached to each run under "Artifacts". The macOS job also starts the
# app on a real Mac and keeps a screenshot, as a smoke test.
name: Build installers

on:
  push:
    branches: [main, cross-platform-macos]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Tasky/Tasky.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained, win-x64)
        run: dotnet publish Tasky/Tasky.csproj -c Release -r win-x64 -o Tasky/bin/Release/net8.0/win-x64/publish

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Tasky-${{ steps.version.outputs.value }}-Windows-installer
          path: installer/Output/TaskySetup.exe
          if-no-files-found: error

  macos:
    name: macOS dmg (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Tasky.app and dmg
        run: ./scripts/package-macos.sh ${{ matrix.arch }}

      # The runner is Apple silicon, so the arm64 build can be launched directly.
      - name: Smoke test (start the app and take a screenshot)
        if: matrix.arch == 'arm64'
        run: |
          export TASKY_DATA_ROOT="$RUNNER_TEMP/tasky-smoke"
          dist/Tasky.app/Contents/MacOS/Tasky &
          PID=$!
          sleep 25
          screencapture -x "$RUNNER_TEMP/tasky-macos.png" || true
          LOGS="$TASKY_DATA_ROOT/Local/Tasky/logs"
          if [ -d "$LOGS" ]; then echo "── Tasky log ──"; cat "$LOGS"/*.log; fi
          if kill -0 "$PID" 2>/dev/null; then
            echo "Tasky is running"
            kill "$PID"
          else
            echo "Tasky exited during start-up"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64' && always()
        with:
          name: macos-smoke-test-screenshot
          path: ${{ runner.temp }}/tasky-macos.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Tasky-macOS-${{ matrix.arch }}-dmg
          path: dist/*.dmg
          if-no-files-found: error
